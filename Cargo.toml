[package]
name = "orchard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[lints.clippy]
cognitive_complexity = "warn"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5.3"
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
jiff = "0.2.42"
rpassword = "7.4.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
